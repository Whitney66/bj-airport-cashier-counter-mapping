<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>收银员与柜组关系维护 - 高保真原型</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="brand-name">大数据平台</div>
      </div>
      <nav class="nav">
        <button class="back el-button el-button--text" aria-label="返回">‹</button>
        <a>分析</a><a>库存分析</a><a>顾客分析</a><a>采购分析</a><a>提货分析</a><a>风险管控</a><a>离线分析</a><a>自定义分析</a><a class="active">数据填报</a>
      </nav>
      <div class="top-actions">
        <div class="search el-input el-input--small"><input class="el-input__inner" placeholder="搜索" /><span>⌕</span></div>
        <button class="icon-btn el-button el-button--text" aria-label="通知">♢</button>
        <button class="icon-btn el-button el-button--text" aria-label="全屏">⛶</button>
        <div class="avatar">cdf</div>
      </div>
    </header>

    <main class="page">
      <div class="tabs">
        <button class="el-tag">经营看板 <span>×</span></button>
        <button class="selected el-tag el-tag--light">收银员与柜组关系维护 <span>×</span></button>
      </div>

      <section class="filters el-form" id="filters">
        <div class="filter-line">
          <label class="filter-item month-filter"><span>月份</span><div class="popover-control" id="monthControl"><button class="select-trigger date-trigger" id="monthTrigger" type="button"><i>▦</i><b id="monthSummary">2026-06 - 2026-06</b><em>⌄</em></button><div class="month-panel" id="monthPanel" hidden><div class="month-shortcuts" id="monthShortcuts"></div><div class="month-main"><div class="month-head"><button type="button" id="prevYear" aria-label="上一年">«</button><strong id="panelYear">2026 年</strong><button type="button" id="nextYear" aria-label="下一年">»</button></div><div class="month-grid" id="monthGrid"></div><p class="month-help" id="monthHelp">请选择开始月份</p></div></div></div></label>

          <label class="filter-item area-item"><span>区域类型</span><div class="popover-control multi-select" id="areaFilter"><button class="select-trigger" id="areaTrigger" type="button"><b id="areaSummary">全部</b><em>⌄</em></button><div class="select-panel" id="areaPanel" hidden><label><input type="checkbox" value="全部" checked />全部</label><label><input type="checkbox" value="出境" checked />出境</label><label><input type="checkbox" value="入境" checked />入境</label></div></div></label>

          <label class="filter-item team-item"><span>柜组</span><div class="popover-control" id="teamControl"><button class="select-trigger" id="teamTrigger" type="button"><b id="teamSummary" class="placeholder">请选择柜组</b><em>⌄</em></button><div class="cascade-panel" id="cascadePanel" hidden><div class="cascade-column"><div class="cascade-title">团队</div><div id="cascadeZones"></div></div><div class="cascade-column teams-column"><div class="cascade-title">柜组</div><div id="cascadeTeams"></div></div></div></div></label>

          <label class="filter-item value-item"><span>收银员</span><div class="batch-control"><input id="cashierNameInput" placeholder="请输入收银员姓名" /><button type="button" class="more-button" data-batch="name" aria-label="批量输入收银员姓名">•••</button></div></label>
          <label class="filter-item value-item id-item"><span>工号</span><div class="batch-control"><input id="cashierIdInput" placeholder="请输入8位工号" /><button type="button" class="more-button" data-batch="id" aria-label="批量输入工号">•••</button></div></label>
          <div class="filter-buttons"><button class="primary small el-button el-button--primary" id="queryBtn">⌕ 查询</button><button class="ghost small el-button" id="resetBtn">↻ 重置</button></div>
        </div>
        <p class="filter-error" id="filterError" role="alert"></p>
      </section>

      <section class="toolbar">
        <div><button class="primary el-button el-button--primary" id="addBtn">新增</button><button class="outline el-button" id="importBtn">导入</button><button class="danger el-button el-button--danger" id="batchDeleteBtn" type="button">▥ 批量删除</button></div>
      </section>

      <section class="table-wrap el-table el-table--border">
        <table class="el-table__body">
          <thead><tr><th class="check"><input type="checkbox" id="selectAll" aria-label="全选" /></th><th>月份</th><th>区域类型</th><th>团队</th><th>柜组</th><th>收银员</th><th>工号</th><th>操作</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>

      <footer class="pager el-pagination">
        <div class="float-tools"><button class="el-button">▦</button><button class="el-button">⇩</button><button class="el-button">⇅</button><button class="el-button">Σ</button></div>
        <span id="totalText">共 0 条</span><select class="el-input__inner"><option>30条/页</option></select><button class="page-btn muted el-button">‹</button><button class="page-btn current el-button el-button--primary">1</button><button class="page-btn el-button">›</button><span>前往</span><input class="jump el-input__inner" value="1" /><span>页</span>
      </footer>
    </main>
  </div>

  <div class="modal-mask" id="relationModal" hidden>
    <div class="relation-modal el-dialog" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 id="relationTitle">新增关系</h2><button type="button" class="close" data-close-modal="relationModal" aria-label="关闭">×</button></div>
      <div class="relation-form">
        <label><span><i>*</i>月份</span><input id="relationMonth" type="month" value="2026-06" /><small>必填，选择关系所属月份。</small></label>
        <label><span><i>*</i>区域类型</span><select id="relationArea"></select><small>必填，选择出境或入境。</small></label>
        <label><span><i>*</i>团队</span><select id="relationZone"></select><small>必填，按区域联动团队。</small></label>
        <label class="counter-field"><span><i>*</i>柜组</span><select id="relationTeam"></select><small>必填，展示“[编码]柜组名称”。</small></label>
        <label><span><i>*</i>收银员</span><div class="eop-combo" id="cashierCombo"><input id="relationCashier" autocomplete="off" placeholder="请输入或选择收银员姓名" /><button type="button" class="combo-arrow" data-eop-toggle="name" aria-label="选择收银员">⌄</button><div class="eop-options" id="cashierOptions" hidden></div></div><small>必填，来源于总部 EOP；重名时按工号区分。</small></label>
        <label><span><i>*</i>工号</span><div class="eop-combo" id="cashierIdCombo"><input id="relationCashierId" autocomplete="off" placeholder="请输入或选择工号" /><button type="button" class="combo-arrow" data-eop-toggle="id" aria-label="选择工号">⌄</button><div class="eop-options" id="cashierIdOptions" hidden></div></div><small>必填，与收银员姓名相互关联。</small></label>
      </div>
      <div class="modal-actions"><button class="primary el-button el-button--primary" id="saveRelationBtn">确定</button><button class="ghost el-button" data-close-modal="relationModal">取消</button></div>
    </div>
  </div>

  <div class="modal-mask" id="importModal" hidden>
    <div class="import-modal el-dialog" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>导入收银员柜组关系</h2><button type="button" class="close" data-close-modal="importModal" aria-label="关闭">×</button></div>
      <div class="upload-box"><div class="cloud">☁</div><p>将文件拖到此处，或<span>点击上传</span></p><input type="file" accept=".xls,.xlsx" /></div>
      <p class="hint">模板字段：月份、区域类型、团队、柜组、收银员、工号。<a href="./templates/收银员与柜组关系导入模板.xlsx" download>下载模板</a></p>
      <div class="modal-actions"><button class="primary el-button el-button--primary" data-close-modal="importModal">确定</button><button class="ghost el-button" data-close-modal="importModal">取消</button></div>
    </div>
  </div>


  <div class="modal-mask" id="batchModal" hidden>
    <div class="batch-modal el-dialog" role="dialog" aria-modal="true" aria-labelledby="batchTitle">
      <div class="modal-head"><h2 id="batchTitle">编辑收银员姓名多值</h2><button type="button" class="close" id="batchClose" aria-label="关闭">×</button></div>
      <div class="batch-body">
        <div class="batch-caption"><strong>输入选项值（每行一个）</strong><span>当前已输入：<b id="batchCount">0</b> 个</span></div>
        <textarea id="batchTextarea" placeholder="每行输入一个收银员姓名"></textarea>
      </div>
      <div class="modal-actions"><button class="primary el-button el-button--primary" id="batchConfirm">确定</button><button class="ghost el-button" id="batchCancel">取消</button></div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
