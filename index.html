<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>收银员与柜组关系维护 - 高保真原型</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="brand-name">大数据平台</div>
      </div>
      <nav class="nav">
        <button class="back el-button el-button--text" aria-label="返回">‹</button>
        <a>分析</a><a>库存分析</a><a>顾客分析</a><a>采购分析</a><a>提货分析</a><a>风险管控</a><a>离线分析</a><a>自定义分析</a><a class="active">数据填报</a>
      </nav>
      <div class="top-actions">
        <div class="search el-input el-input--small"><input class="el-input__inner" placeholder="搜索" /><span>⌕</span></div>
        <button class="icon-btn el-button el-button--text" aria-label="通知">♢</button>
        <button class="icon-btn el-button el-button--text" aria-label="全屏">⛶</button>
        <div class="avatar">cdf</div>
      </div>
    </header>

    <main class="page">
      <div class="tabs">
        <button class="el-tag">经营看板 <span>×</span></button>
        <button class="selected el-tag el-tag--light">收银员与柜组关系维护 <span>×</span></button>
      </div>

      <section class="filters el-form" id="filters">
        <div class="filter-grid">
          <label class="el-form-item month-item"><span>月份</span><div class="month-range"><input class="el-input__inner" id="monthStart" type="month" value="2026-06" /><i>至</i><input class="el-input__inner" id="monthEnd" type="month" value="2026-06" /></div></label>
          <label class="el-form-item"><span>区域类型</span><div class="multi-select" id="areaFilter"><button class="select-trigger" id="areaTrigger" type="button" aria-expanded="false"><b id="areaSummary">全部</b><i>⌄</i></button><div class="select-panel" id="areaPanel" hidden><label><input type="checkbox" value="全部" checked />全部</label><label><input type="checkbox" value="出境" checked />出境</label><label><input type="checkbox" value="入境" checked />入境</label></div></div></label>
          <label class="el-form-item cascade-item"><span>柜组</span><div class="cascade"><select class="el-input__inner" id="cascadeArea"><option value="">全部区域</option></select><select class="el-input__inner" id="zoneFilter"><option value="">全部分区</option></select><select class="el-input__inner" id="teamFilter"><option value="">全部团队</option></select></div></label>
          <label class="el-form-item"><span>收银员</span><div class="tag-input" id="cashierNameTags"><div class="tag-list"></div><input placeholder="输入后按 Enter" /></div></label>
          <label class="el-form-item"><span>工号</span><div class="tag-input" id="cashierIdTags"><div class="tag-list"></div><input placeholder="输入后按 Enter" /></div></label>
          <label class="el-form-item"><span>关系类型</span><select class="el-input__inner" id="relationFilter"><option value="">全部类型</option><option>固定柜组</option><option>跨柜组</option></select></label>
          <div class="filter-buttons"><button class="primary small el-button el-button--primary" id="queryBtn">⌕ 查询</button><button class="ghost small el-button" id="resetBtn">↻ 重置</button></div>
        </div>
        <p class="filter-error" id="filterError" role="alert"></p>
      </section>

      <section class="table-wrap el-table el-table--border">
        <table class="el-table__body">
          <thead><tr><th>月份</th><th>区域类型</th><th>柜组</th><th>收银员</th><th>工号</th><th>关系类型</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>

      <footer class="pager el-pagination">
        <div class="float-tools"><button class="el-button">▦</button><button class="el-button">⇩</button><button class="el-button">⇅</button><button class="el-button">Σ</button></div>
        <span id="totalText">共 0 条</span><select class="el-input__inner"><option>30条/页</option></select><button class="page-btn muted el-button">‹</button><button class="page-btn current el-button el-button--primary">1</button><button class="page-btn el-button">›</button><span>前往</span><input class="jump el-input__inner" value="1" /><span>页</span>
      </footer>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
